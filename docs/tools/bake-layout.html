<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bake graph layout</title>
<style>
  body { font: 14px/1.5 ui-sans-serif, -apple-system, "Segoe UI", Roboto, sans-serif; margin: 24px; max-width: 760px; }
  textarea { width: 100%; height: 320px; font: 12px ui-monospace, Menlo, Consolas, monospace; }
  code { font: 12px ui-monospace, Menlo, Consolas, monospace; }
</style>
</head>
<body>
<h1>Bake graph layout</h1>
<p>Produces <code>docs/data/layout.json</code> for the project page. Save the output over that
file, then run <code>python docs/build.py</code> to rebuild <code>kg.js</code> and the static SVG.
The result is deterministic: the same parameters always give the same coordinates.</p>
<p><button id="download">Download layout.json</button> <span id="status"></span></p>
<textarea id="out" readonly></textarea>

<script src="../vendor/g6.min.js"></script>
<script src="../data/kg.js"></script>
<script>
(function () {
  "use strict";

  var TYPES = ["Physiological", "Sleep", "Activity", "Lifestyle",
               "Mental", "Environmental", "Demographic"];

  // Physiological links to every other category, so it sits in the middle;
  // the rest go round it in an order that keeps strongly linked pairs adjacent
  // (Activity-Demographic, Demographic-Mental, Mental-Sleep, ...).
  var PARAMS = {
    threshold: 0.75,             // edges the layout sees, as on the page
    hub: "Physiological",
    ring: ["Lifestyle", "Activity", "Demographic", "Mental", "Sleep", "Environmental"],
    ringRadius: [265, 215],      // x, y
    pull: 0.1,                   // towards the category's anchor
    inDistance: 55, inStrength: 0.25,      // links within a category
    outDistance: 200, outStrength: 0.004,  // links across categories barely pull
    charge: -95, chargeMax: 160,
    gap: 9,                      // clearance between node circles
    iterations: 600
  };

  function nodeSize(deg) { return 9 + Math.sqrt(deg) * 2.4; }  // as in app.js

  function anchors(p) {
    var a = {};
    a[p.hub] = [0, 0];
    p.ring.forEach(function (t, k) {
      var ang = -Math.PI / 2 + k * 2 * Math.PI / p.ring.length;
      a[t] = [p.ringRadius[0] * Math.cos(ang), p.ringRadius[1] * Math.sin(ang)];
    });
    return a;
  }

  function bake(data, p) {
    var type = data.nodes.map(function (n) {
      return TYPES.indexOf(n.type) >= 0 ? n.type : "Demographic";
    });
    var deg = data.nodes.map(function () { return 0; });
    var edges = [];
    data.edges.forEach(function (e, k) {
      if (e[2] < p.threshold) return;
      deg[e[0]]++; deg[e[1]]++;
      edges.push({ id: "e" + k, source: "n" + e[0], target: "n" + e[1],
                   data: { same: type[e[0]] === type[e[1]] } });
    });
    var nodes = data.nodes.map(function (n, i) {
      return { id: "n" + i, data: { cat: type[i], r: nodeSize(deg[i]) / 2 } };
    });
    var at = anchors(p);

    // G6's registered d3-force layout, driven directly: it only needs a graph
    // that can list its nodes and edges
    var D3Force = G6.getExtension("layout", "d3-force");
    var layout = new D3Force({
      link: {
        id: function (e) { return e.id; },
        distance: function (e) { return e.data.same ? p.inDistance : p.outDistance; },
        strength: function (e) { return e.data.same ? p.inStrength : p.outStrength; }
      },
      manyBody: { strength: p.charge, distanceMax: p.chargeMax },
      center: { x: 0, y: 0, strength: 0.05 },
      collide: { radius: function (d) { return d.r + p.gap; }, strength: 1, iterations: 2 },
      x: { x: function (d) { return at[d.cat][0]; }, strength: p.pull },
      y: { y: function (d) { return at[d.cat][1]; }, strength: p.pull }
    });
    layout.execute({
      getAllNodes: function () { return nodes; },
      getAllEdges: function () { return edges; },
      mergeNodeData: function () {}
    });
    layout.stop();
    var result = layout.tick(p.iterations);

    var byId = {};
    result.nodes.forEach(function (n) { byId[n.id] = [n.data.x, n.data.y]; });
    return data.nodes.map(function (n, i) {
      var q = byId["n" + i];
      return [Math.round(q[0] * 10) / 10, Math.round(q[1] * 10) / 10];
    });
  }

  var json = JSON.stringify({
    _comment: "Baked node coordinates for the knowledge graph, in kg.json node order. " +
              "Produced by docs/tools/bake-layout.html (G6 d3-force with a per-category " +
              "anchor). build.py fits them into the static SVG box.",
    params: PARAMS,
    pos: bake(window.__WAG_KG__, PARAMS)
  });

  document.getElementById("out").value = json;
  document.getElementById("status").textContent =
    window.__WAG_KG__.nodes.length + " nodes";
  document.getElementById("download").addEventListener("click", function () {
    var a = document.createElement("a");
    a.href = URL.createObjectURL(new Blob([json + "\n"], { type: "application/json" }));
    a.download = "layout.json";
    a.click();
  });
})();
</script>
</body>
</html>
